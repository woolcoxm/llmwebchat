packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: set this to true or false

onlyBuiltDependencies:
  - esbuild

# pnpm 11 runs an install check before every script which trips on esbuild's
# build script flag; the build itself is approved above, so disable the check.
verifyDepsBeforeRun: false
